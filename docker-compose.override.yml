# 호스트에 공개하는 포트는 ai-service API 하나뿐이다. Gateway·MCP 서버·로컬 모델 서버는 공개하지 않는다.
# `docker compose`는 이 파일을 자동으로 함께 읽고, scripts/install.sh·compose-model.sh도 같이 읽는다.
# 바인딩 주소·포트는 .env의 N_NOTE_API_BIND_ADDRESS·N_NOTE_API_PORT로 바꾼다(로컬만: 127.0.0.1).
# 포트를 열지 않으려면 `docker compose -f docker-compose.yml ...`처럼 이 파일을 빼고 실행한다.
services:
  ai-service:
    ports:
      - "${N_NOTE_API_BIND_ADDRESS:-0.0.0.0}:${N_NOTE_API_PORT:-8400}:8000"
