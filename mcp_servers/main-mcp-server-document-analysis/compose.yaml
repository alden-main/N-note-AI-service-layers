services:
  report:
    build:
      context: .
      dockerfile: Dockerfile
    image: n-note-mcp-report:0.1.0
    restart: unless-stopped
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp

# 단독 실행 전용 네트워크다. Gateway와의 연동은 root docker-compose.yml로 실행한다.
networks:
  default:
    internal: true
