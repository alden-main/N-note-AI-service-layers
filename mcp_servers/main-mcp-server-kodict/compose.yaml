services:
  korean-standard-dictionary:
    build:
      context: .
      args:
        # 이미지에 포함할 사전 릴리스(data/releases/<버전>/)다.
        KODICT_RELEASE: ${KODICT_RELEASE:-2026.10}
    image: korean-standard-dictionary:${KODICT_IMAGE_TAG:-0.1.0}
    environment:
      KODICT_MAX_CONCURRENT_REQUESTS: ${KODICT_MAX_CONCURRENT_REQUESTS:-4}
      KODICT_MAX_FINDINGS: ${KODICT_MAX_FINDINGS:-1000}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - mcp-gateway-network
    restart: unless-stopped

networks:
  mcp-gateway-network:
    external: true
    name: mcp-gateway-network
