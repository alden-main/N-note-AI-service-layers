services:
  korean:
    build:
      context: .
      args:
        # 이미지에 포함할 사전 릴리스(data/releases/<버전>/)다.
        KODICT_RELEASE: ${KODICT_RELEASE:-2026.10}
    image: n-note-mcp-korean:${KODICT_IMAGE_TAG:-0.1.0}
    environment:
      KODICT_MAX_CONCURRENT_REQUESTS: ${KODICT_MAX_CONCURRENT_REQUESTS:-4}
      KODICT_MAX_FINDINGS: ${KODICT_MAX_FINDINGS:-1000}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# 단독 실행 전용 네트워크다. Gateway와의 연동은 root docker-compose.yml로 실행한다.
networks:
  default:
    internal: true
