[project]
name = "main-mcp-server-kodict"
version = "0.1.0"
description = "한국어 표준어 사전 근거를 제공하는 MCP 서버"
readme = "README.md"
authors = [
    { name = "alden-main", email = "alden@gkmain.com" }
]
requires-python = ">=3.12"
dependencies = [
    "files-to-prompt>=0.6",
    "kiwipiepy>=0.21,<1",
    "mcp>=1.20,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
build = ["xlrd>=2.0.1,<3"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
main-mcp-server-kodict = "main_mcp_server_kodict:main"
build-korean-dictionary = "main_mcp_server_kodict.build_dictionary:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["src/main_mcp_server_kodict/data/*.json"]
