services:
  medic:
    build: .
    image: n-note-mcp-medic:local
    environment:
      MEDICALDICT_MCP_TRANSPORT: streamable-http
      MEDICALDICT_MCP_HOST: 0.0.0.0
      MEDICALDICT_MCP_PORT: "8000"
    expose:
      - "8000"
    volumes:
      - medicaldict-history:/var/lib/medicaldict
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  medicaldict-history:

# 단독 실행 전용 네트워크다. Gateway와의 연동은 root docker-compose.yml로 실행한다.
networks:
  default:
    internal: true
