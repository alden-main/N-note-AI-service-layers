# 한 번에 ai-service, MCP Gateway, MCP 서버 3종(표준국어·의학용어·보고서 검증)을 띄운다.
#   docker compose up -d --build
# 기본 STT·LLM은 OpenAI API다(SaaS). 로컬 모델(온프레미스·폐쇄망)은 deploy/models/<profile>.env를 함께 지정하면
# local-stt·local-llm도 띄운다.
#   scripts/compose-model.sh medgemma-27b up -d
#
# 네트워크 경계: ai-service는 ai-gateway-network에만, MCP 서버는 mcp-gateway-network(internal)에만 연결한다.
# Gateway만 두 네트워크에 연결되므로 ai-service는 MCP 서버에 직접 접근할 수 없다.
x-mcp-healthcheck: &mcp-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

x-vllm: &vllm
  ipc: host
  environment:
    # gated 모델(MedGemma 등) 다운로드용이다. 폐쇄망에서는 미리 받은 캐시만 쓰도록 HF_HUB_OFFLINE=1로 둔다.
    HF_TOKEN: ${HF_TOKEN:-}
    HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
  volumes:
    - ${N_NOTE_MODEL_CACHE:-./model-cache}:/root/.cache/huggingface
  networks:
    - ai-gateway-network
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 900s
  restart: unless-stopped

services:
  ai-service:
    build:
      context: .
      args:
        N_NOTE_INSTALL_NER: ${N_NOTE_INSTALL_NER:-false}
    # 배포 번들(scripts/bundle.sh)은 모든 이미지를 같은 N_NOTE_IMAGE_TAG로 만들고, 서버는 이 이름으로 적재한다.
    image: n-note-ai-service:${N_NOTE_IMAGE_TAG:-local}
    environment:
      MCP_GATEWAY_URL: http://gateway:8080/mcp
      # OpenAI API를 쓰는 경우에만 필요하다(로컬 모델만 쓰면 비워 둔다).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      N_NOTE_MODEL_PROFILE: ${N_NOTE_MODEL_PROFILE:-openai}
      # STT·LLM 서버. base URL이 비어 있으면 OpenAI API를 사용한다.
      N_NOTE_STT_BASE_URL: ${N_NOTE_STT_BASE_URL:-}
      N_NOTE_STT_MODEL: ${N_NOTE_STT_MODEL:-${OPENAI_STT_MODEL:-gpt-4o-transcribe}}
      N_NOTE_STT_PROMPT: ${N_NOTE_STT_PROMPT:-${OPENAI_STT_PROMPT:-}}
      N_NOTE_LLM_BASE_URL: ${N_NOTE_LLM_BASE_URL:-}
      N_NOTE_LLM_MODEL: ${N_NOTE_LLM_MODEL:-${OPENAI_DRAFT_MODEL:-gpt-4o-mini}}
      N_NOTE_LLM_API: ${N_NOTE_LLM_API:-}
      N_NOTE_LLM_TOOL_CALLING: ${N_NOTE_LLM_TOOL_CALLING:-true}
      N_NOTE_LLM_EXTRA_BODY: ${N_NOTE_LLM_EXTRA_BODY:-}
      N_NOTE_LLM_MAX_TOKENS: ${N_NOTE_LLM_MAX_TOKENS:-}
      N_NOTE_LLM_TEMPERATURE: ${N_NOTE_LLM_TEMPERATURE:-}
      # 운영 양식 7종 중 기본 양식과 활성화할 양식 목록(쉼표 구분, 비우면 전체)이다.
      N_NOTE_DEFAULT_FORM: ${N_NOTE_DEFAULT_FORM:-nursing-daily-note}
      N_NOTE_ENABLED_FORMS: ${N_NOTE_ENABLED_FORMS:-}
      # STT·LLM 요청 제한 시간(초)과 재시도 횟수다. SDK 기본값(600초·2회)은 요청을 수십 분 붙잡는다.
      N_NOTE_STT_TIMEOUT_SECONDS: ${N_NOTE_STT_TIMEOUT_SECONDS:-60}
      N_NOTE_LLM_TIMEOUT_SECONDS: ${N_NOTE_LLM_TIMEOUT_SECONDS:-90}
      N_NOTE_MODEL_MAX_RETRIES: ${N_NOTE_MODEL_MAX_RETRIES:-1}
      # 전사문 용어 검토를 LLM 힌트로 쓰려고 기다리는 최대 시간(초)이다. 넘으면 힌트 없이 초안 생성을 시작한다.
      N_NOTE_TERM_HINT_BUDGET_SECONDS: ${N_NOTE_TERM_HINT_BUDGET_SECONDS:-3}
      # 실환자 운영에서는 true로 둔다: 비식별화 전 원본 음성이 외부 OpenAI로 나가지 않게 로컬 STT만 허용한다.
      N_NOTE_REQUIRE_LOCAL_STT: ${N_NOTE_REQUIRE_LOCAL_STT:-false}
      N_NOTE_TIMEZONE: ${N_NOTE_TIMEZONE:-Asia/Seoul}
      N_NOTE_WORKERS: ${N_NOTE_WORKERS:-2}
      N_NOTE_DRAFT_RETENTION_HOURS: ${N_NOTE_DRAFT_RETENTION_HOURS:-72}
      # 브리지·인증 프록시가 인증한 사용자 ID 헤더다. 운영에서는 필수(true)로 둔다.
      N_NOTE_USER_HEADER: ${N_NOTE_USER_HEADER:-X-Authenticated-User}
      N_NOTE_REQUIRE_AUTHENTICATED_USER: ${N_NOTE_REQUIRE_AUTHENTICATED_USER:-false}
      MCP_GATEWAY_CATALOG_TTL_SECONDS: ${MCP_GATEWAY_CATALOG_TTL_SECONDS:-300}
      N_NOTE_GATEWAY_MAX_CONCURRENCY: ${N_NOTE_GATEWAY_MAX_CONCURRENCY:-4}
      # 초안 생성 비동기 작업: worker당 동시 실행 수·대기열 상한·멈춘 작업 판정 시간(초)이다.
      N_NOTE_JOB_CONCURRENCY: ${N_NOTE_JOB_CONCURRENCY:-4}
      N_NOTE_JOB_MAX_PENDING: ${N_NOTE_JOB_MAX_PENDING:-32}
      N_NOTE_JOB_TIMEOUT_SECONDS: ${N_NOTE_JOB_TIMEOUT_SECONDS:-600}
      # 로컬 NER 비식별화(N_NOTE_INSTALL_NER=true로 빌드). 비우면 규칙 기반만 쓴다.
      N_NOTE_NER_MODEL: ${N_NOTE_NER_MODEL:-}
      N_NOTE_NER_MIN_SCORE: ${N_NOTE_NER_MIN_SCORE:-0.8}
      N_NOTE_NER_THREADS: ${N_NOTE_NER_THREADS:-2}
      # NER 모델은 미리 받은 캐시만 쓴다(scripts/download_models.sh). 원문이 외부로 나가지 않는다.
      HF_HUB_OFFLINE: ${N_NOTE_NER_HF_OFFLINE:-1}
    volumes:
      - ./forms:/app/forms:ro
      - n-note-artifacts:/var/lib/n-note/artifacts
      # 초안·핸드오프·감사 이력·양식 상태·작업 상태(SQLite)다.
      - n-note-state:/var/lib/n-note/state
      # 로컬 NER 모델 캐시(로컬 STT·LLM과 같은 캐시)다.
      - ${N_NOTE_MODEL_CACHE:-./model-cache}:/root/.cache/huggingface:ro
      # 모델 비교 평가 사례·결과(scripts/compose-model.sh <profile> run --rm ai-service ...)
      - ./eval:/app/eval
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ai-gateway-network

  # MCP Gateway: ai-service가 호출하는 유일한 MCP endpoint(http://gateway:8080/mcp)다.
  gateway:
    build: ./mcp_servers/main-mcp-gateway-server
    image: n-note-mcp-gateway:${N_NOTE_IMAGE_TAG:-local}
    command: ["gateway", "--port", "8080"]
    environment:
      # ai-service의 MCP_GATEWAY_TIMEOUT_SECONDS(기본 15초)보다 작게 유지한다.
      GATEWAY_UPSTREAM_TIMEOUT_SECONDS: ${GATEWAY_UPSTREAM_TIMEOUT_SECONDS:-5}
      GATEWAY_HEALTH_TTL_SECONDS: ${GATEWAY_HEALTH_TTL_SECONDS:-5}
      GATEWAY_BATCH_MAX_CALLS: ${GATEWAY_BATCH_MAX_CALLS:-32}
      GATEWAY_BATCH_MAX_CONCURRENCY: ${GATEWAY_BATCH_MAX_CONCURRENCY:-8}
    volumes:
      - ./mcp_servers/main-mcp-gateway-server/config/upstreams.yaml:/app/config/upstreams.yaml:ro
    # MCP 서버 하나가 실패해도 Gateway·ai-service는 뜬다(해당 검토만 unavailable). 늦게 준비된 MCP는
    # 다음 tools/list에서 Gateway가 다시 찾고, ai-service는 도구가 빠진 catalog를 15초마다 다시 조회한다.
    depends_on:
      korean-standard-dictionary:
        condition: service_started
      medical-term-review:
        condition: service_started
      report-validation:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ai-gateway-network
      - mcp-gateway-network
    restart: unless-stopped

  # 아래 MCP 서버의 서비스 이름은 upstreams.yaml의 호스트명과 같아야 한다. host port는 공개하지 않는다.
  # 표준국어대사전 MCP. 검증된 SQLite 릴리스를 읽기 전용으로 마운트한다.
  korean-standard-dictionary:
    build: ./mcp_servers/main-mcp-server-kodict
    image: n-note-mcp-kodict:${N_NOTE_IMAGE_TAG:-local}
    environment:
      KODICT_DATABASE_PATH: /app/data/korean_standard_dictionary.sqlite3
      KODICT_MAX_CONCURRENT_REQUESTS: ${KODICT_MAX_CONCURRENT_REQUESTS:-4}
      KODICT_MAX_FINDINGS: ${KODICT_MAX_FINDINGS:-1000}
    volumes:
      - ${KODICT_DATABASE_HOST_PATH:-./mcp_servers/main-mcp-server-kodict/data/releases/2026.10/korean_standard_dictionary.sqlite3}:/app/data/korean_standard_dictionary.sqlite3:ro
    healthcheck: *mcp-healthcheck
    networks:
      - mcp-gateway-network
    restart: unless-stopped

  # 의학용어 MCP. 사전 snapshot은 이미지에 포함하고 검토 이력만 volume에 남긴다.
  medical-term-review:
    build: ./mcp_servers/main-mcp-server-medicaldict
    image: n-note-mcp-medicaldict:${N_NOTE_IMAGE_TAG:-local}
    environment:
      MEDICALDICT_MCP_TRANSPORT: streamable-http
      MEDICALDICT_MCP_HOST: 0.0.0.0
      MEDICALDICT_MCP_PORT: "8000"
    volumes:
      - medicaldict-history:/var/lib/medicaldict
    healthcheck: *mcp-healthcheck
    networks:
      - mcp-gateway-network
    restart: unless-stopped

  # 보고서(양식) 완결성 검증 MCP. 상태가 없으므로 읽기 전용 파일 시스템으로 실행한다.
  report-validation:
    build: ./mcp_servers/main-mcp-server-document-analysis
    image: n-note-mcp-report-validation:${N_NOTE_IMAGE_TAG:-local}
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck: *mcp-healthcheck
    networks:
      - mcp-gateway-network
    restart: unless-stopped

  # 로컬 Whisper 전사 서버(OpenAI 호환 /v1/audio/transcriptions)
  local-stt:
    <<: *vllm
    profiles: ["local-stt"]
    build:
      context: deploy/models
      dockerfile: stt.Dockerfile
      args:
        N_NOTE_VLLM_IMAGE: ${N_NOTE_VLLM_IMAGE:-vllm/vllm-openai:v0.31.0-cu129}
        N_NOTE_VLLM_VERSION: ${N_NOTE_VLLM_VERSION:-0.31.0}
    image: n-note-local-stt:${N_NOTE_VLLM_VERSION:-0.31.0}
    command: >-
      ${N_NOTE_LOCAL_STT_MODEL:-openai/whisper-large-v3-turbo}
      --served-model-name ${N_NOTE_STT_MODEL:-whisper-large-v3-turbo}
      --gpu-memory-utilization ${N_NOTE_LOCAL_STT_GPU_UTIL:-0.10}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${N_NOTE_STT_GPU:-0}"]
              capabilities: [gpu]

  # 로컬 초안 생성 LLM 서버(OpenAI 호환 /v1/chat/completions). 모델·인자는 프로필 env 파일이 정한다.
  local-llm:
    <<: *vllm
    profiles: ["local-llm"]
    image: ${N_NOTE_VLLM_IMAGE:-vllm/vllm-openai:v0.31.0-cu129}
    command: >-
      ${N_NOTE_LOCAL_LLM_MODEL:-google/medgemma-1.5-4b-it}
      --served-model-name ${N_NOTE_LLM_MODEL:-local-llm}
      ${N_NOTE_LOCAL_LLM_ARGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${N_NOTE_LLM_GPU:-0}"]
              capabilities: [gpu]

volumes:
  n-note-artifacts:
  n-note-state:
  medicaldict-history:

# Compose가 만들고 관리한다(사전 docker network create 불필요). 이름은 기존 문서·외부 스택과 맞춘다.
networks:
  ai-gateway-network:
    name: ai-gateway-network
  mcp-gateway-network:
    name: mcp-gateway-network
    # MCP 서버는 외부 인터넷이 필요 없다(사전 데이터가 이미지·volume에 있다).
    internal: true
