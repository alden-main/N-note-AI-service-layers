# 개발·평가 환경 전용: LLM 추적 화면(Arize Phoenix)을 함께 띄우고 ai-service 추적을 켠다.
#
#   1) .env에 Phoenix 비밀값을 넣는다(각 32자 이상, 저장소에 넣지 않는다).
#        PHOENIX_SECRET=$(python3 -c "import secrets;print(secrets.token_urlsafe(36))")
#        PHOENIX_ADMIN_SECRET=$(python3 -c "import secrets;print(secrets.token_urlsafe(36))")
#        PHOENIX_ADMIN_PASSWORD=<화면 첫 로그인 비밀번호>
#   2) docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
#   3) 브라우저 http://127.0.0.1:6006 → admin@localhost / PHOENIX_ADMIN_PASSWORD 로그인 → 프로젝트 n-note
#
# 화면에서 볼 수 있는 것: 작업(workflow_job) → 단계(stage.*) → 양식별 초안(form_draft) → LLM 호출(llm.completion:
# 엔진·프롬프트 판·도구 왕복 수) → Pydantic AI 실행(invoke_agent)·모델 요청(chat <model>: 토큰 수)·사전 도구(execute_tool)
# → Gateway 호출(llm.tool). native 엔진이면 Agent span 대신 요청 한 번마다 llm.request span이 있다.
#
# 본문(전사문·지침·LLM 응답·도구 인자)은 기본으로 남기지 않는다. 합성 데이터로 평가할 때만
#   N_NOTE_OTEL_CAPTURE_CONTENT=true docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# 로 켠다. 실환자 데이터를 다루는 환경에서는 켜지 않는다(추적 저장소에 비식별화된 전사문이 남는다).
#
# Phoenix(Elastic License 2.0)는 자체 서비스 관측 용도로는 제한 없이 쓸 수 있다. 다른 수신기(Langfuse·Opik·사내
# OpenTelemetry Collector)로 보내려면 OTEL_EXPORTER_OTLP_ENDPOINT·HEADERS만 바꾼다. 코드는 표준 OTLP만 쓴다.
services:
  phoenix:
    image: ${PHOENIX_IMAGE:-arizephoenix/phoenix:version-21.0.0}
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      # 컨테이너 안에서는 0.0.0.0에서 받으므로 Phoenix가 인증을 요구한다. 끄지 않고 비밀값으로 쓴다.
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET:?set PHOENIX_SECRET (32+ chars) in .env}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_ADMIN_SECRET:?set PHOENIX_ADMIN_SECRET (32+ chars) in .env}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD:?set PHOENIX_ADMIN_PASSWORD in .env}
    volumes:
      - phoenix-data:/mnt/data
    networks:
      # ai-service는 내부망(ai-gateway-network)으로 보낸다. 화면 포트 공개에만 n-note-edge를 쓴다.
      - ai-gateway-network
      - n-note-edge
    ports:
      - "${PHOENIX_BIND_ADDRESS:-127.0.0.1}:${PHOENIX_PORT:-6006}:6006"
    restart: unless-stopped

  ai-service:
    environment:
      N_NOTE_OTEL_ENABLED: "true"
      N_NOTE_OTEL_CAPTURE_CONTENT: ${N_NOTE_OTEL_CAPTURE_CONTENT:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer ${PHOENIX_ADMIN_SECRET}"
      OTEL_SERVICE_NAME: n-note-ai-service
      # Phoenix는 이 속성으로 프로젝트를 나눈다(없으면 default 프로젝트).
      OTEL_RESOURCE_ATTRIBUTES: openinference.project.name=${PHOENIX_PROJECT:-n-note}
    depends_on:
      - phoenix

volumes:
  phoenix-data:
